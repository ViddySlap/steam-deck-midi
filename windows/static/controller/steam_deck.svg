<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Original Steam Deck control outline">
  <!-- Original geometric drawing. Coordinates match controller_map.json.
       Arrangement follows Valve's own labelled front render (steamdeck.com tech specs,
       tech-specs_1_english.png): D-pad upper-outer, thumbstick inboard of it and a little
       lower, View/Menu above between them, trackpad below both, ABXY outboard of the right
       stick and a little above its centre. -->
  <g fill="var(--surface2)" stroke="var(--border-hi)" stroke-width="3">
    <path d="M180 100 Q130 100 115 160 L90 330 Q85 405 160 415 L1040 415 Q1115 405 1110 330 L1085 160 Q1070 100 1020 100 Z"/>
    <rect x="380" y="115" width="440" height="270" rx="16" fill="var(--bg)"/>
    <rect x="399" y="134" width="402" height="232" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  </g>
  <g fill="var(--surface3)" stroke="var(--text-mid)" stroke-width="2">
    <rect data-control="l2" x="130" y="32" width="90" height="36" rx="14"/>
    <rect data-control="r2" x="980" y="32" width="90" height="36" rx="14"/>
    <rect data-control="l1" x="160" y="76" width="80" height="28" rx="10"/>
    <rect data-control="r1" x="960" y="76" width="80" height="28" rx="10"/>
    <circle data-control="select" cx="222" cy="116" r="12"/>
    <circle data-control="start" cx="978" cy="116" r="12"/>
    <circle data-control="left_stick" cx="305" cy="190" r="43"/>
    <circle data-control="right_stick" cx="895" cy="190" r="43"/>
    <circle data-control="btn_a" cx="1002" cy="226" r="19"/>
    <circle data-control="btn_b" cx="1042" cy="186" r="19"/>
    <circle data-control="btn_x" cx="962" cy="186" r="19"/>
    <circle data-control="btn_y" cx="1002" cy="146" r="19"/>
    <path data-control="dpad_up" d="M169 164 V130 H201 V164 L185 176 Z"/>
    <path data-control="dpad_down" d="M169 206 L185 194 L201 206 V240 H169 Z"/>
    <path data-control="dpad_left" d="M164 169 L176 185 L164 201 H130 V169 Z"/>
    <path data-control="dpad_right" d="M206 169 H240 V201 H206 L194 185 Z"/>
    <rect data-control="left_pad" x="258" y="295" width="84" height="90" rx="12"/>
    <rect data-control="right_pad" x="858" y="295" width="84" height="90" rx="12"/>
    <circle data-control="qam" cx="980" cy="270" r="12"/>
  </g>
  <g fill="none" stroke="var(--border-hi)" stroke-width="2" stroke-dasharray="8 6">
    <rect x="190" y="423" width="170" height="127" rx="24"/>
    <rect x="840" y="423" width="170" height="127" rx="24"/>
  </g>
  <g fill="var(--surface3)" stroke="var(--text-mid)" stroke-width="2">
    <rect data-control="l4" x="225" y="433" width="70" height="24" rx="10"/>
    <rect data-control="l5" x="225" y="503" width="70" height="24" rx="10"/>
    <rect data-control="r4" x="905" y="433" width="70" height="24" rx="10"/>
    <rect data-control="r5" x="905" y="503" width="70" height="24" rx="10"/>
    <rect data-control="gyro" x="540" y="457" width="120" height="86" rx="14"/>
  </g>
  <g fill="var(--text-mid)" font-family="inherit" text-anchor="middle" font-size="18" pointer-events="none">
    <text x="600" y="244" font-size="24" letter-spacing="4">CONTROLLER</text>
    <text x="600" y="276">Select a control to inspect</text>
    <text x="1002" y="232">A</text><text x="1042" y="192">B</text>
    <text x="962" y="192">X</text><text x="1002" y="152">Y</text>
    <text x="305" y="168" font-size="12">L3</text><text x="895" y="168" font-size="12">R3</text>
    <text x="328" y="492" font-size="16">REAR</text><text x="872" y="492" font-size="16">REAR</text>
    <text x="600" y="507">GYRO</text>
    <text x="980" y="276" font-size="14" letter-spacing="2">...</text>
  </g>
</svg>
